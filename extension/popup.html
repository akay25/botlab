<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>botlab probe</title>
<style>
  :root {
    --paper:#edebe4; --panel:#f6f5f0; --ink:#1a1d1a; --rule:#c9c6bc; --mute:#6f6c62;
    --bot:#b4331f; --human:#1f5c8c; --warn:#c67a12;
    --mono: ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  * { box-sizing:border-box; }
  body { width:400px; margin:0; padding:16px 16px 20px; background:var(--paper);
         color:var(--ink); font-family:var(--sans); font-size:13px; }
  h1 { font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:.3em;
       text-transform:uppercase; margin:0 0 4px; }
  .host { font-family:var(--mono); font-size:10.5px; color:var(--mute);
          word-break:break-all; border-bottom:2px solid var(--ink); padding-bottom:10px; }
  h2 { font-family:var(--mono); font-size:9.5px; letter-spacing:.2em; text-transform:uppercase;
       color:var(--mute); font-weight:600; border-bottom:1px solid var(--rule);
       padding-bottom:5px; margin:18px 0 10px; }
  .readout { display:flex; align-items:baseline; gap:12px; margin-top:14px; }
  .num { font-family:var(--mono); font-size:52px; line-height:.85; font-weight:600;
         font-variant-numeric:tabular-nums; }
  .verdict { font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase; }
  .rail { position:relative; height:20px; margin-top:12px; }
  .track { position:absolute; top:9px; left:0; right:0; height:3px;
           background:linear-gradient(90deg,var(--bot) 0%,var(--warn) 42%,var(--human) 100%); }
  .needle { position:absolute; top:2px; width:2px; height:18px; background:var(--ink); }
  .ends { display:flex; justify-content:space-between; font-family:var(--mono);
          font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:var(--mute); }
  .row { display:grid; grid-template-columns:78px 1fr 44px; gap:8px; align-items:center;
         border-bottom:1px solid var(--rule); padding:6px 0; }
  .row .n { font-family:var(--mono); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; }
  .row .n.hit::before { content:"\25B8 "; color:var(--bot); }
  .axis { position:relative; height:12px; background:var(--panel); }
  .axis .z { position:absolute; left:50%; top:0; bottom:0; width:1px; background:var(--rule); }
  .axis .b { position:absolute; top:2px; height:8px; }
  .v { font-family:var(--mono); font-size:10.5px; text-align:right; color:var(--mute);
       font-variant-numeric:tabular-nums; }
  .div { border-left:3px solid var(--bot); background:var(--panel); padding:7px 10px; margin-bottom:6px; }
  .div .f { font-family:var(--mono); font-size:10.5px; font-weight:600; }
  .div .d { font-family:var(--mono); font-size:10px; color:var(--mute); word-break:break-all; }
  .clean { border-left:3px solid var(--human); background:var(--panel); padding:9px 10px; }
  ul { list-style:none; margin:0; padding:0; max-height:170px; overflow:auto; }
  li { border-left:3px solid var(--rule); background:var(--panel); padding:6px 9px; margin-bottom:5px; }
  li.bot { border-left-color:var(--bot); } li.human { border-left-color:var(--human); }
  li code { display:block; font-family:var(--mono); font-size:9.5px; color:var(--mute); }
  label { display:block; font-family:var(--mono); font-size:9.5px; letter-spacing:.12em;
          text-transform:uppercase; color:var(--mute); margin:10px 0 4px; }
  input[type=text] { width:100%; font-family:var(--mono); font-size:11px; padding:7px 8px;
                     border:1px solid var(--rule); background:#fff; color:var(--ink); }
  .check { display:flex; align-items:center; gap:7px; margin-top:10px; font-size:12px; }
  .btns { display:flex; gap:7px; margin-top:12px; }
  button { flex:1; font-family:var(--mono); font-size:9.5px; letter-spacing:.12em;
           text-transform:uppercase; padding:8px 6px; border:1px solid var(--ink);
           background:var(--ink); color:var(--paper); cursor:pointer; }
  button.ghost { background:transparent; color:var(--ink); }
  .note { font-size:11.5px; color:var(--mute); margin:8px 0 0; }
  .status { font-family:var(--mono); font-size:10px; margin-top:8px; color:var(--mute); }
  button:focus-visible, input:focus-visible { outline:2px solid var(--warn); outline-offset:2px; }
</style>
</head>
<body>
  <h1>botlab probe</h1>
  <div class="host" id="host">no page measured</div>

  <div class="readout">
    <div class="num" id="score">--</div>
    <div class="verdict" id="verdict">waiting</div>
  </div>
  <div class="rail"><div class="track"></div><div class="needle" id="needle" style="left:50%"></div></div>
  <div class="ends"><span>1 automated</span><span>99 human</span></div>

  <h2>World comparison</h2>
  <div id="divergences"><div class="clean">No report has arrived yet.</div></div>
  <p class="note">The page reads the main world. The extension reads the isolated world.
  A stealth patch changes one world only.</p>

  <h2>Evidence by layer</h2>
  <div id="ladder"></div>

  <h2>Signals</h2>
  <ul id="signals"></ul>

  <h2>Harness</h2>
  <label for="harness">Harness URL</label>
  <input type="text" id="harness" placeholder="https://127.0.0.1:8443" autocomplete="off">
  <label for="label">Run label</label>
  <input type="text" id="label" placeholder="chrome-141-stealth" autocomplete="off">
  <div class="check"><input type="checkbox" id="auto"><span>Send every report to the harness</span></div>
  <div class="btns">
    <button id="measure">Measure again</button>
    <button class="ghost" id="send">Send now</button>
  </div>
  <div class="btns"><button class="ghost" id="export">Export history CSV</button></div>
  <div class="status" id="status"></div>

<script src="popup.js" type="module"></script>
</body>
</html>
