<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>botlab — sessions</title>
<style>
  :root {
    --paper:#edebe4; --panel:#f6f5f0; --ink:#1a1d1a; --rule:#c9c6bc; --mute:#6f6c62;
    --bot:#b4331f; --human:#1f5c8c; --warn:#c67a12;
    --mono: ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans: "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:14px; }
  .wrap { max-width:1180px; margin:0 auto; padding:0 20px 70px; }
  header { border-bottom:2px solid var(--ink); padding:26px 0 12px; margin-bottom:24px; }
  h1 { font-family:var(--mono); font-size:15px; font-weight:600; letter-spacing:.34em;
       text-transform:uppercase; margin:0 0 6px; }
  .sub { color:var(--mute); margin:0; max-width:64ch; }
  .block { display:flex; gap:0 30px; flex-wrap:wrap; margin-top:14px; font-family:var(--mono);
           font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--mute); }
  .block b { color:var(--ink); }
  a { color:var(--human); }
  table { width:100%; border-collapse:collapse; }
  th { font-family:var(--mono); font-size:10.5px; letter-spacing:.16em; text-transform:uppercase;
       color:var(--mute); text-align:left; border-bottom:1px solid var(--ink); padding:8px 8px; font-weight:600; }
  td { border-bottom:1px solid var(--rule); padding:9px 8px; vertical-align:top; }
  tr:hover td { background:var(--panel); }
  .score { font-family:var(--mono); font-size:19px; font-weight:600; font-variant-numeric:tabular-nums; }
  .chip { font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
          border:1px solid var(--rule); padding:2px 7px; display:inline-block; }
  .chip.hit { border-color:var(--bot); color:var(--bot); }
  .ids { font-family:var(--mono); font-size:11px; color:var(--mute); word-break:break-all; }
  .ua { font-size:12px; color:var(--mute); max-width:280px; word-break:break-all; }
  .ja4 { font-family:var(--mono); font-size:11px; word-break:break-all; }
  .empty { padding:50px 0; color:var(--mute); text-align:center; border:1px dashed var(--rule); }
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>botlab &middot; sessions</h1>
  <p class="sub">Each row is one scored session. The earliest column names the first layer in the stack that flagged the client. Reload a client with a run label to build a comparison matrix.</p>
  <div class="block">
    <span>rows <b id="count">0</b></span>
    <span>refresh <b>3 s</b></span>
    <span><a href="/">test page</a></span>
    <span><a href="/export.csv">export.csv</a></span>
  </div>
</header>
<div id="host"><div class="empty">No session has arrived yet. Open the test page in a client.</div></div>
</div>
<script>
function colorFor(score) {
  if (score <= 10) { return "var(--bot)"; }
  if (score <= 30) { return "var(--warn)"; }
  if (score <= 60) { return "var(--ink)"; }
  return "var(--human)";
}

function render(rows) {
  document.getElementById("count").textContent = rows.length;
  var host = document.getElementById("host");
  if (!rows.length) { return; }
  var html = '<table><thead><tr><th>score</th><th>verdict</th><th>earliest</th>' +
             '<th>label</th><th>ja4</th><th>user agent</th><th>detection ids</th><th>time</th>' +
             '</tr></thead><tbody>';
  rows.forEach(function (s) {
    var r = s.result || {};
    var ids = [];
    Object.keys(r.layers || {}).forEach(function (k) {
      ids = ids.concat((r.layers[k] || {}).ids || []);
    });
    html += '<tr>' +
      '<td class="score" style="color:' + colorFor(r.score) + '">' + (r.score || "-") + '</td>' +
      '<td>' + (r.verdict || "-") + '</td>' +
      '<td>' + (r.first_catching_layer
        ? '<span class="chip hit">' + r.first_catching_layer + '</span>'
        : '<span class="chip">none</span>') + '</td>' +
      '<td>' + (s.label || "&mdash;") + '</td>' +
      '<td class="ja4">' + ((s.tls || {}).ja4 || "&mdash;") + '</td>' +
      '<td class="ua">' + ((s.headers || {})["user-agent"] || "&mdash;") + '</td>' +
      '<td class="ids">' + ids.join(" ") + '</td>' +
      '<td class="ids">' + (s.time || "").replace("T", " ") + '</td>' +
      '</tr>';
  });
  host.innerHTML = html + "</tbody></table>";
}

function poll() {
  fetch("/api/sessions").then(function (r) { return r.json(); })
    .then(render).catch(function () { /* the server is not reachable */ });
}
poll();
setInterval(poll, 3000);
</script>
</body>
</html>
