<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>botlab — run report</title>
<style>
  :root {
    --paper:#edebe4; --panel:#f6f5f0; --ink:#1a1d1a; --rule:#c9c6bc; --mute:#6f6c62;
    --bot:#b4331f; --human:#1f5c8c; --warn:#c67a12;
    --mono: ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink);
         font-family:var(--sans); font-size:14px; line-height:1.5; }
  .wrap { max-width:1060px; margin:0 auto; padding:0 22px 90px; }
  header { border-bottom:2px solid var(--ink); padding:26px 0 12px; margin-bottom:26px; }
  h1 { font-family:var(--mono); font-size:14px; font-weight:600; letter-spacing:.34em;
       text-transform:uppercase; margin:0 0 6px; }
  .sub { color:var(--mute); margin:0; max-width:66ch; }
  .block { display:flex; gap:0 28px; flex-wrap:wrap; margin-top:14px; font-family:var(--mono);
           font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--mute); }
  .block b { color:var(--ink); font-weight:600; }
  a { color:var(--human); }
  section { margin-bottom:32px; }
  h2 { font-family:var(--mono); font-size:11px; letter-spacing:.22em; text-transform:uppercase;
       color:var(--mute); font-weight:600; border-bottom:1px solid var(--rule);
       padding-bottom:7px; margin:0 0 14px; }
  .hint { color:var(--mute); font-size:13px; margin:10px 0 0; max-width:70ch; }
  .readout { display:flex; align-items:flex-end; gap:22px; flex-wrap:wrap; }
  .num { font-family:var(--mono); font-size:76px; line-height:.82; font-weight:600;
         font-variant-numeric:tabular-nums; }
  .verdict { font-family:var(--mono); font-size:12px; letter-spacing:.18em;
             text-transform:uppercase; padding-bottom:8px; }
  .rail { position:relative; height:30px; margin-top:16px; }
  .track { position:absolute; top:13px; left:0; right:0; height:3px;
           background:linear-gradient(90deg,var(--bot) 0%,var(--warn) 42%,var(--human) 100%); }
  .needle { position:absolute; top:2px; width:2px; height:25px; background:var(--ink); }
  .ends { display:flex; justify-content:space-between; font-family:var(--mono);
          font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--mute); }
  .ladder { border-top:1px solid var(--rule); }
  .row { display:grid; grid-template-columns:120px 1fr 66px; align-items:center; gap:14px;
         border-bottom:1px solid var(--rule); padding:9px 0; }
  .row .n { font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; }
  .row .n.hit::before { content:"\25B8 "; color:var(--bot); }
  .axis { position:relative; height:16px; background:var(--panel); }
  .axis .z { position:absolute; left:50%; top:0; bottom:0; width:1px; background:var(--rule); }
  .axis .b { position:absolute; top:3px; height:10px; }
  .v { font-family:var(--mono); font-size:12px; text-align:right; color:var(--mute);
       font-variant-numeric:tabular-nums; }
  .group { margin-bottom:18px; }
  .group h3 { font-family:var(--mono); font-size:10.5px; letter-spacing:.18em;
              text-transform:uppercase; margin:0 0 8px; }
  ul.sig { list-style:none; margin:0; padding:0; }
  ul.sig li { border-left:3px solid var(--rule); background:var(--panel);
              padding:7px 0 7px 12px; margin-bottom:7px; }
  ul.sig li.bot { border-left-color:var(--bot); }
  ul.sig li.human { border-left-color:var(--human); }
  ul.sig code { display:block; font-family:var(--mono); font-size:11px; color:var(--mute); }
  table { width:100%; border-collapse:collapse; margin-bottom:8px; }
  th { font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase;
       color:var(--mute); text-align:left; border-bottom:1px solid var(--ink);
       padding:7px 8px; font-weight:600; }
  td { border-bottom:1px solid var(--rule); padding:6px 8px; vertical-align:top;
       font-family:var(--mono); font-size:11.5px; word-break:break-word; }
  td.k { color:var(--mute); width:46%; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:26px; }
  .btns { display:flex; gap:9px; flex-wrap:wrap; }
  button { font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
           padding:9px 15px; border:1px solid var(--ink); background:var(--ink);
           color:var(--paper); cursor:pointer; }
  button.ghost { background:transparent; color:var(--ink); }
  .empty { padding:40px 0; color:var(--mute); text-align:center; border:1px dashed var(--rule); }
  @media (max-width:760px) { .two { grid-template-columns:1fr; } .num { font-size:56px; } }
  @media print { body { background:#fff; } .noprint { display:none; } }
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>botlab &middot; run report</h1>
  <p class="sub">One run of the interaction test. The behavioural metrics below are derived on
  the server from the raw event stream, which is stored with the run, so every number here can
  be recomputed.</p>
  <div class="block">
    <span>run <b id="m-id">—</b></span>
    <span>label <b id="m-label">—</b></span>
    <span>time <b id="m-time">—</b></span>
    <span><a href="/">new run</a></span>
    <span><a href="/dashboard">dashboard</a></span>
  </div>
</header>

<div id="body"><div class="empty">Loading the run.</div></div>
</div>

<script>
(function () {
  "use strict";

  var LAYERS = ["network", "tls", "http", "browser", "worlds", "runtime",
                "environment", "behavior", "consistency"];
  var record = null;

  function text(v) {
    return (v === undefined || v === null || v === "") ? "—" : String(v);
  }
  function colorFor(score) {
    if (score <= 10) { return "var(--bot)"; }
    if (score <= 30) { return "var(--warn)"; }
    if (score <= 60) { return "var(--ink)"; }
    return "var(--human)";
  }
  function el(tag, className, content) {
    var node = document.createElement(tag);
    if (className) { node.className = className; }
    if (content !== undefined) { node.textContent = content; }
    return node;
  }
  function table(pairs) {
    var t = el("table");
    var body = el("tbody");
    pairs.forEach(function (pair) {
      var tr = el("tr");
      var k = el("td", "k", pair[0]);
      var v = el("td", null, text(pair[1]));
      tr.appendChild(k); tr.appendChild(v);
      body.appendChild(tr);
    });
    t.appendChild(body);
    return t;
  }
  function flatten(source, prefix) {
    var out = [];
    Object.keys(source || {}).forEach(function (key) {
      var name = prefix ? prefix + "." + key : key;
      var value = source[key];
      if (value && typeof value === "object" && !Array.isArray(value)) {
        out = out.concat(flatten(value, name));
      } else if (Array.isArray(value)) {
        out.push([name, value.length ? value.join(", ") : "—"]);
      } else {
        out.push([name, value]);
      }
    });
    return out;
  }

  function section(title, node, hint) {
    var s = el("section");
    s.appendChild(el("h2", null, title));
    s.appendChild(node);
    if (hint) { s.appendChild(el("p", "hint", hint)); }
    return s;
  }

  function ladder(layers, caught) {
    var host = el("div", "ladder");
    var peak = 4;
    LAYERS.forEach(function (n) {
      peak = Math.max(peak, Math.abs((layers[n] || {}).weight || 0));
    });
    LAYERS.forEach(function (n) {
      var entry = layers[n];
      var w = (entry || {}).weight || 0;
      var pct = Math.min(50, Math.abs(w) / peak * 50);
      var row = el("div", "row");
      var label = el("div", "n" + (n === caught ? " hit" : ""), n);
      var axis = el("div", "axis");
      axis.innerHTML = '<div class="z"></div><div class="b" style="background:' +
        (w >= 0 ? "var(--bot)" : "var(--human)") + ";left:" + (w >= 0 ? 50 : 50 - pct) +
        "%;width:" + pct + '%"></div>';
      var value = el("div", "v", (w > 0 ? "+" : "") + w.toFixed(1));
      row.appendChild(label); row.appendChild(axis); row.appendChild(value);
      host.appendChild(row);
    });
    return host;
  }

  function signals(list) {
    var host = el("div");
    LAYERS.forEach(function (layer) {
      var rows = (list || []).filter(function (s) { return s.layer === layer; });
      if (!rows.length) { return; }
      var weight = rows.reduce(function (sum, s) { return sum + s.weight; }, 0);
      var group = el("div", "group");
      group.appendChild(el("h3", null, layer + " · " + (weight > 0 ? "+" : "") + weight.toFixed(1)));
      var ul = el("ul", "sig");
      rows.sort(function (a, b) { return b.weight - a.weight; }).forEach(function (s) {
        var li = el("li", s.weight > 0 ? "bot" : "human");
        li.appendChild(el("code", null, s.id + "  " + (s.weight > 0 ? "+" : "") + s.weight));
        li.appendChild(el("span", null, s.detail));
        ul.appendChild(li);
      });
      group.appendChild(ul);
      host.appendChild(group);
    });
    return host.children.length ? host : el("div", "empty", "The scorer produced no signals.");
  }

  function render(data) {
    record = data;
    var result = data.result || {};
    document.getElementById("m-id").textContent = text(data.id);
    document.getElementById("m-label").textContent = text(data.label);
    document.getElementById("m-time").textContent =
      text((data.time || "").replace("T", " "));

    var host = document.getElementById("body");
    host.innerHTML = "";

    var verdict = el("section");
    verdict.appendChild(el("h2", null, "Verdict"));
    var readout = el("div", "readout");
    var num = el("div", "num", result.score);
    num.style.color = colorFor(result.score);
    readout.appendChild(num);
    readout.appendChild(el("div", "verdict", result.verdict));
    verdict.appendChild(readout);
    var rail = el("div", "rail");
    rail.innerHTML = '<div class="track"></div><div class="needle" style="left:' +
      ((result.score - 1) / 98 * 100) + '%"></div>';
    verdict.appendChild(rail);
    var ends = el("div", "ends");
    ends.innerHTML = "<span>1 automated</span><span>50 unclear</span><span>99 human</span>";
    verdict.appendChild(ends);
    verdict.appendChild(el("p", "hint",
      result.first_catching_layer
        ? "The " + result.first_catching_layer + " layer flagged this run first. The strongest " +
          "single layer was " + result.strongest_layer + "."
        : "No layer flagged this run."));
    host.appendChild(verdict);

    host.appendChild(section("Evidence by layer",
      ladder(result.layers || {}, result.first_catching_layer)));
    host.appendChild(section("Signals", signals(result.signals)));

    var metrics = result.behavior_metrics;
    if (metrics) {
      var grid = el("div", "two");
      var left = el("div");
      left.appendChild(el("h3", null, "pointer"));
      left.appendChild(table(flatten(metrics.pointer)));
      var right = el("div");
      right.appendChild(el("h3", null, "keys"));
      right.appendChild(table(flatten(metrics.keys)));
      right.appendChild(el("h3", null, "clicks and input"));
      right.appendChild(table(flatten(metrics.clicks).concat(flatten(metrics.inputs))));
      grid.appendChild(left); grid.appendChild(right);
      host.appendChild(section("Behavioural metrics", grid,
        "Every number here is derived on the server from the stored event stream. " +
        "Straightness is direct distance over travelled distance: 1.0 is a straight line. " +
        "Dwell is how long a key was held; flight is the gap between key presses."));
    }

    var tasks = (data.behavior || {}).targets || [];
    if (tasks.length) {
      host.appendChild(section("Targets clicked", table(tasks.map(function (t) {
        return [t.id, "centre " + t.cx + "," + t.cy + " at " + t.t + " ms"];
      }))));
    }

    if (data.tls) {
      host.appendChild(section("TLS handshake", table([
        ["ja4", data.tls.ja4], ["ja4_r", data.tls.ja4_r], ["ja3", data.tls.ja3],
        ["alpn", (data.tls.alpn || []).join(", ")], ["grease", String(data.tls.grease)],
        ["cipher count", data.tls.cipher_count], ["extension count", data.tls.ext_count]
      ])));
    }

    host.appendChild(section("Browser fingerprint", table(flatten(data.js))));
    if (data.runtime) {
      host.appendChild(section("Runtime probes", table(flatten(data.runtime))));
    }
    if (data.environment) {
      host.appendChild(section("Environment probes", table(flatten(data.environment))));
    }
    host.appendChild(section("Request headers, in the order the browser sent them",
      table((data.header_order || []).map(function (name, i) {
        return [(i + 1) + ". " + name, (data.headers || {})[name]];
      })),
      "Scored from the " + text(data.header_source) + " request."));

    var exports = el("div", "btns");
    var jsonButton = el("button", null, "Download JSON");
    jsonButton.addEventListener("click", function () {
      var blob = new Blob([JSON.stringify(record, null, 2)], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var link = document.createElement("a");
      link.href = url;
      link.download = "botlab-" + (record.label || record.id) + ".json";
      link.click();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    });
    var printButton = el("button", "ghost", "Print");
    printButton.addEventListener("click", function () { window.print(); });
    exports.appendChild(jsonButton);
    exports.appendChild(printButton);
    var exportSection = section("Export", exports,
      "The JSON holds the whole record, including the raw event stream this report was " +
      "derived from.");
    exportSection.className = "noprint";
    host.appendChild(exportSection);
  }

  var id = location.pathname.replace(/\/+$/, "").split("/").pop();
  fetch("/api/sessions/" + encodeURIComponent(id))
    .then(function (r) {
      if (!r.ok) { throw new Error("not found"); }
      return r.json();
    })
    .then(function (envelope) { render(envelope.data); })
    .catch(function () {
      document.getElementById("body").innerHTML =
        '<div class="empty">No run has the id ' + id + '. It may have been trimmed ' +
        'from the log, or the run never finished.</div>';
    });
})();
</script>
</body>
</html>
