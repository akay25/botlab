<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>botlab — run report</title>
<style>
  :root {
    --paper:#edebe4; --panel:#f6f5f0; --ink:#1a1d1a; --rule:#c9c6bc; --mute:#6f6c62;
    --bot:#b4331f; --human:#1f5c8c; --warn:#c67a12;
    --mono: ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink);
         font-family:var(--sans); font-size:14px; line-height:1.5; }
  .wrap { max-width:1060px; margin:0 auto; padding:0 22px 90px; }
  header { border-bottom:2px solid var(--ink); padding:26px 0 12px; margin-bottom:26px; }
  h1 { font-family:var(--mono); font-size:14px; font-weight:600; letter-spacing:.34em;
       text-transform:uppercase; margin:0 0 6px; }
  .sub { color:var(--mute); margin:0; max-width:66ch; }
  .block { display:flex; gap:0 28px; flex-wrap:wrap; margin-top:14px; font-family:var(--mono);
           font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--mute); }
  .block b { color:var(--ink); font-weight:600; }
  a { color:var(--human); }
  section { margin-bottom:32px; }
  h2 { font-family:var(--mono); font-size:11px; letter-spacing:.22em; text-transform:uppercase;
       color:var(--mute); font-weight:600; border-bottom:1px solid var(--rule);
       padding-bottom:7px; margin:0 0 14px; }
  .hint { color:var(--mute); font-size:13px; margin:10px 0 0; max-width:70ch; }
  .readout { display:flex; align-items:flex-end; gap:22px; flex-wrap:wrap; }
  .num { font-family:var(--mono); font-size:76px; line-height:.82; font-weight:600;
         font-variant-numeric:tabular-nums; }
  .verdict { font-family:var(--mono); font-size:12px; letter-spacing:.18em;
             text-transform:uppercase; padding-bottom:8px; }
  .rail { position:relative; height:30px; margin-top:16px; }
  .track { position:absolute; top:13px; left:0; right:0; height:3px;
           background:linear-gradient(90deg,var(--bot) 0%,var(--warn) 42%,var(--human) 100%); }
  .needle { position:absolute; top:2px; width:2px; height:25px; background:var(--ink); }
  .ends { display:flex; justify-content:space-between; font-family:var(--mono);
          font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--mute); }
  .ladder { border-top:1px solid var(--rule); }
  .row { display:grid; grid-template-columns:120px 1fr 66px; align-items:center; gap:14px;
         border-bottom:1px solid var(--rule); padding:9px 0; }
  .row .n { font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; }
  .row .n.hit::before { content:"\25B8 "; color:var(--bot); }
  .axis { position:relative; height:16px; background:var(--panel); }
  .axis .z { position:absolute; left:50%; top:0; bottom:0; width:1px; background:var(--rule); }
  .axis .b { position:absolute; top:3px; height:10px; }
  .v { font-family:var(--mono); font-size:12px; text-align:right; color:var(--mute);
       font-variant-numeric:tabular-nums; }
  .group { margin-bottom:18px; }
  .group h3 { font-family:var(--mono); font-size:10.5px; letter-spacing:.18em;
              text-transform:uppercase; margin:0 0 8px; }
  ul.sig { list-style:none; margin:0; padding:0; }
  ul.sig li { border-left:3px solid var(--rule); background:var(--panel);
              padding:7px 0 7px 12px; margin-bottom:7px; }
  ul.sig li.bot { border-left-color:var(--bot); }
  ul.sig li.human { border-left-color:var(--human); }
  ul.sig code { display:block; font-family:var(--mono); font-size:11px; color:var(--mute); }
  table { width:100%; border-collapse:collapse; margin-bottom:8px; }
  th { font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase;
       color:var(--mute); text-align:left; border-bottom:1px solid var(--ink);
       padding:7px 8px; font-weight:600; }
  td { border-bottom:1px solid var(--rule); padding:6px 8px; vertical-align:top;
       font-family:var(--mono); font-size:11.5px; word-break:break-word; }
  td.k { color:var(--mute); width:46%; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:26px; }
  .btns { display:flex; gap:9px; flex-wrap:wrap; }
  button { font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
           padding:9px 15px; border:1px solid var(--ink); background:var(--ink);
           color:var(--paper); cursor:pointer; }
  button.ghost { background:transparent; color:var(--ink); }
  .empty { padding:40px 0; color:var(--mute); text-align:center; border:1px dashed var(--rule); }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(112px,1fr));
           gap:8px; margin-bottom:12px; }
  .tile { border:1px solid var(--rule); background:var(--panel); padding:9px 11px; }
  .tile b { display:block; font-family:var(--mono); font-size:9.5px; letter-spacing:.15em;
            text-transform:uppercase; color:var(--mute); font-weight:600; margin-bottom:4px; }
  .tile span { font-family:var(--mono); font-size:19px; font-variant-numeric:tabular-nums; }
  .tile span.bad { color:var(--bot); }
  .tile span.good { color:var(--human); }
  .typed { font-family:var(--mono); font-size:12.5px; background:var(--panel);
           border:1px solid var(--rule); padding:9px 11px; margin-bottom:12px;
           word-break:break-all; color:var(--ink); }
  .trace { width:100%; height:auto; display:block; background:var(--panel);
           border:1px solid var(--rule); }
  .trace-wrap { overflow-x:auto; }
  .legend { display:flex; gap:0 20px; flex-wrap:wrap; margin-top:10px;
            font-family:var(--mono); font-size:10.5px; letter-spacing:.1em;
            text-transform:uppercase; color:var(--mute); }
  .legend span { display:flex; align-items:center; gap:6px; }
  .legend i { width:16px; height:0; border-top-width:3px; border-top-style:solid;
              display:inline-block; }
  .legend i.dot { width:8px; height:8px; border-radius:50%; border:none; }
  .legend i.ring { width:9px; height:9px; border-radius:50%; border:1.5px dashed var(--mute);
                   border-top-style:dashed; }
  @media (max-width:760px) { .two { grid-template-columns:1fr; } .num { font-size:56px; } }
  @media print { body { background:#fff; } .noprint { display:none; } }
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>botlab &middot; run report</h1>
  <p class="sub">One run of the interaction test. The behavioural metrics below are derived on
  the server from the raw event stream, which is stored with the run, so every number here can
  be recomputed.</p>
  <div class="block">
    <span>run <b id="m-id">—</b></span>
    <span>label <b id="m-label">—</b></span>
    <span>time <b id="m-time">—</b></span>
    <span><a href="/">new run</a></span>
    <span><a href="/dashboard">dashboard</a></span>
  </div>
</header>

<div id="body"><div class="empty">Loading the run.</div></div>
</div>

<script>
(function () {
  "use strict";

  var LAYERS = ["network", "tls", "http", "browser", "runtime",
                "environment", "behavior", "consistency"];
  var record = null;

  function text(v) {
    return (v === undefined || v === null || v === "") ? "—" : String(v);
  }
  function colorFor(score) {
    if (score <= 10) { return "var(--bot)"; }
    if (score <= 30) { return "var(--warn)"; }
    if (score <= 60) { return "var(--ink)"; }
    return "var(--human)";
  }
  function el(tag, className, content) {
    var node = document.createElement(tag);
    if (className) { node.className = className; }
    if (content !== undefined) { node.textContent = content; }
    return node;
  }
  function table(pairs) {
    var t = el("table");
    var body = el("tbody");
    pairs.forEach(function (pair) {
      var tr = el("tr");
      var k = el("td", "k", pair[0]);
      var v = el("td", null, text(pair[1]));
      tr.appendChild(k); tr.appendChild(v);
      body.appendChild(tr);
    });
    t.appendChild(body);
    return t;
  }
  /* Drop keys that are drawn elsewhere, so the table stays a table of numbers. */
  function without(source, names) {
    var copy = {};
    Object.keys(source || {}).forEach(function (key) {
      if (names.indexOf(key) === -1) { copy[key] = source[key]; }
    });
    return copy;
  }
  function flatten(source, prefix) {
    var out = [];
    Object.keys(source || {}).forEach(function (key) {
      var name = prefix ? prefix + "." + key : key;
      var value = source[key];
      if (value && typeof value === "object" && !Array.isArray(value)) {
        out = out.concat(flatten(value, name));
      } else if (Array.isArray(value)) {
        if (!value.length) {
          out.push([name, "—"]);
        } else if (value.some(function (item) {
          return item !== null && typeof item === "object";
        })) {
          /* A list of records rather than of values. Joining it would print
             [object Object] once per entry, so say how many there are and leave
             the detail to the chart that draws it and to the JSON download. */
          out.push([name, value.length + " entries"]);
        } else {
          out.push([name, value.join(", ")]);
        }
      } else {
        out.push([name, value]);
      }
    });
    return out;
  }

  function section(title, node, hint) {
    var s = el("section");
    s.appendChild(el("h2", null, title));
    s.appendChild(node);
    if (hint) { s.appendChild(el("p", "hint", hint)); }
    return s;
  }

  /* The engine stores a weight where positive counts against the client. The
     report shows that value negated, so the number, the bar direction and the
     colour all read the same way as the score rail above it: to the right and
     blue is human, to the left and red is automated. What /api/sessions and
     export.csv carry is the raw engine weight, which is this number negated. */
  function toward(weight) { return -(weight || 0); }

  function signed(value) { return (value > 0 ? "+" : "") + value.toFixed(1); }

  /* ------------------------------------------------------- pointer trace */

  var SVG_NS = "http://www.w3.org/2000/svg";
  /* Keep in step with TELEPORT_PX in src/detection/behavior.py, so a jump drawn
     in red here is the same jump the scorer charged as behavior.pointer_teleport. */
  var TELEPORT_PX = 150;
  var TARGET_RADIUS = 28;          // the task page draws 56 px circles

  function svg(tag, attrs) {
    var node = document.createElementNS(SVG_NS, tag);
    Object.keys(attrs || {}).forEach(function (key) {
      node.setAttribute(key, attrs[key]);
    });
    return node;
  }

  function trace(behavior, fp) {
    var points = (behavior || {}).pointer || [];
    var clicks = (behavior || {}).clicks || [];
    var targets = (behavior || {}).targets || [];
    if (!points.length && !clicks.length) { return null; }

    /* Draw in the client's own viewport coordinates, so the picture is where
       the pointer actually was rather than a normalised abstraction. Start from
       the reported window and widen it to hold anything that fell outside. */
    var minX = 0, minY = 0;
    var maxX = Number((fp || {}).inner_width) || 0;
    var maxY = Number((fp || {}).inner_height) || 0;
    var every = points.concat(clicks).concat(targets.map(function (t) {
      return { x: t.cx, y: t.cy };
    }));
    every.forEach(function (p) {
      var x = Number(p.x), y = Number(p.y);
      if (isFinite(x)) { minX = Math.min(minX, x); maxX = Math.max(maxX, x); }
      if (isFinite(y)) { minY = Math.min(minY, y); maxY = Math.max(maxY, y); }
    });
    if (maxX - minX < 10) { maxX = minX + 10; }
    if (maxY - minY < 10) { maxY = minY + 10; }

    var pad = Math.max(12, (maxX - minX) * 0.02);
    minX -= pad; minY -= pad; maxX += pad; maxY += pad;
    var width = maxX - minX, height = maxY - minY;
    var unit = Math.max(width, height) / 320;   // keeps marks the same visual size

    var root = svg("svg", {
      "class": "trace",
      viewBox: minX + " " + minY + " " + width + " " + height,
      preserveAspectRatio: "xMidYMid meet",
      role: "img",
      "aria-label": "The path the pointer travelled during this run"
    });

    // The reported window, for scale.
    if (Number((fp || {}).inner_width) && Number((fp || {}).inner_height)) {
      root.appendChild(svg("rect", {
        x: 0, y: 0, width: fp.inner_width, height: fp.inner_height,
        fill: "none", stroke: "var(--rule)", "stroke-width": unit,
        "stroke-dasharray": (unit * 6) + " " + (unit * 5)
      }));
    }

    // Where the task's targets sat, so an approach can be read against them.
    targets.forEach(function (t) {
      root.appendChild(svg("circle", {
        cx: t.cx, cy: t.cy, r: TARGET_RADIUS, fill: "none",
        stroke: "var(--mute)", "stroke-width": unit * 1.2,
        "stroke-dasharray": (unit * 4) + " " + (unit * 4)
      }));
    });

    // The path, broken wherever the pointer jumped with no event in between.
    var moved = "";
    var teleports = 0;
    var travelled = 0;
    for (var i = 0; i < points.length; i++) {
      var p = points[i];
      if (i === 0) { moved += "M" + p.x + "," + p.y; continue; }
      var previous = points[i - 1];
      var step = Math.sqrt(Math.pow(p.x - previous.x, 2) + Math.pow(p.y - previous.y, 2));
      travelled += step;
      if (step > TELEPORT_PX) {
        teleports += 1;
        root.appendChild(svg("line", {
          x1: previous.x, y1: previous.y, x2: p.x, y2: p.y,
          stroke: "var(--bot)", "stroke-width": unit * 1.4,
          "stroke-dasharray": (unit * 5) + " " + (unit * 4), opacity: "0.85"
        }));
        moved += "M" + p.x + "," + p.y;
      } else {
        moved += "L" + p.x + "," + p.y;
      }
    }
    if (moved) {
      root.appendChild(svg("path", {
        d: moved, fill: "none", stroke: "var(--human)",
        "stroke-width": unit * 1.6, "stroke-linejoin": "round",
        "stroke-linecap": "round", opacity: "0.9"
      }));
    }

    /* One dot per recorded event. This is the density the scorer reads: a hand
       reporting at 60 Hz leaves a dense trail, and a driver that places the
       pointer at its destination leaves almost nothing. */
    points.forEach(function (p) {
      root.appendChild(svg("circle", {
        cx: p.x, cy: p.y, r: unit * 1.3, fill: "var(--ink)", opacity: "0.5"
      }));
    });

    if (points.length) {
      root.appendChild(svg("circle", {
        cx: points[0].x, cy: points[0].y, r: unit * 4, fill: "none",
        stroke: "var(--warn)", "stroke-width": unit * 1.6
      }));
    }

    clicks.forEach(function (c, index) {
      root.appendChild(svg("circle", {
        cx: c.x, cy: c.y, r: unit * 4.5, fill: "var(--ink)"
      }));
      var label = svg("text", {
        x: Number(c.x) + unit * 7, y: Number(c.y) - unit * 5,
        fill: "var(--ink)", "font-size": unit * 11,
        "font-family": "ui-monospace, monospace"
      });
      label.textContent = String(index + 1);
      root.appendChild(label);
    });

    var wrap = el("div", "trace-wrap");
    wrap.appendChild(root);

    var legend = el("div", "legend");
    [["path travelled", "var(--human)", "line"],
     ["jump over " + TELEPORT_PX + " px", "var(--bot)", "line"],
     ["one recorded event", "var(--ink)", "dot"],
     ["click", "var(--ink)", "dot"],
     ["first event", "var(--warn)", "line"],
     ["task target", "var(--mute)", "ring"]].forEach(function (item) {
      var entry = el("span");
      var swatch = el("i", item[2] === "line" ? null : item[2]);
      if (item[2] === "dot") { swatch.style.background = item[1]; }
      else if (item[2] === "ring") { swatch.style.borderColor = item[1]; }
      else { swatch.style.borderTopColor = item[1]; }
      entry.appendChild(swatch);
      entry.appendChild(el("span", null, item[0]));
      legend.appendChild(entry);
    });

    var host = el("div");
    host.appendChild(wrap);
    host.appendChild(legend);
    host.appendChild(el("p", "hint",
      points.length + " pointer events over " + Math.round(travelled) + " px"
      + (travelled >= 1
         ? ", " + (points.length / (travelled / 100)).toFixed(1) + " per 100 px"
         : "")
      + ", " + clicks.length + " click(s), " + teleports + " jump(s)."));
    return host;
  }

  /* ---------------------------------------------------- keystroke timing */

  function tile(label, value, tone) {
    var node = el("div", "tile");
    node.appendChild(el("b", null, label));
    node.appendChild(el("span", tone || null, value));
    return node;
  }

  function polyline(series, pick, width, height, pad, count, top, colour) {
    /* Build one line, broken wherever a keystroke has no value for it: the
       first key has no flight, and a key never released has no dwell. */
    var d = "";
    var dots = [];
    var open = false;
    series.forEach(function (entry, index) {
      var value = pick(entry);
      if (value === null || value === undefined || !isFinite(value)) {
        open = false;
        return;
      }
      var x = pad.l + (count < 2 ? 0 : (index / (count - 1)) * (width - pad.l - pad.r));
      var y = height - pad.b - (Math.min(value, top) / top) * (height - pad.t - pad.b);
      d += (open ? "L" : "M") + x.toFixed(1) + "," + y.toFixed(1);
      open = true;
      dots.push([x, y]);
    });
    var group = svg("g", {});
    if (d) {
      group.appendChild(svg("path", {
        d: d, fill: "none", stroke: colour, "stroke-width": "2",
        "stroke-linejoin": "round", "stroke-linecap": "round"
      }));
    }
    dots.forEach(function (p) {
      group.appendChild(svg("circle", { cx: p[0], cy: p[1], r: "2.4", fill: colour }));
    });
    return group;
  }

  function keystrokes(keys) {
    var series = (keys || {}).series || [];
    if (series.length < 2) { return null; }

    var host = el("div");

    /* The numbers the chart is made of, so a reader does not have to measure
       the picture to get them. */
    var tiles = el("div", "tiles");
    var flightCv = keys.flight_cv, dwellCv = keys.dwell_cv;
    tiles.appendChild(tile("keys", String(keys.down_count || series.length)));
    tiles.appendChild(tile("flight mean", Math.round(keys.flight_ms_mean || 0) + " ms"));
    tiles.appendChild(tile("dwell mean", Math.round(keys.dwell_ms_mean || 0) + " ms"));
    if (flightCv !== null && flightCv !== undefined) {
      tiles.appendChild(tile("flight variation", Math.round(flightCv * 100) + "%",
        flightCv < 0.15 ? "bad" : "good"));
    }
    if (dwellCv !== null && dwellCv !== undefined) {
      tiles.appendChild(tile("dwell variation", Math.round(dwellCv * 100) + "%",
        dwellCv < 0.12 ? "bad" : "good"));
    }
    tiles.appendChild(tile("untrusted", String(keys.untrusted || 0),
      keys.untrusted ? "bad" : null));
    host.appendChild(tiles);

    var typed = series.map(function (entry) {
      var key = entry.key || "";
      return key.length === 1 ? key : "⟨" + key + "⟩";
    }).join("");
    host.appendChild(el("div", "typed", typed));

    var W = 1000, H = 330;
    var pad = { l: 46, r: 12, t: 12, b: 30 };
    var top = 0;
    series.forEach(function (entry) {
      top = Math.max(top, entry.dwell || 0, entry.flight || 0);
    });
    top = Math.max(50, Math.ceil(top / 50) * 50);

    var chart = svg("svg", {
      "class": "trace", viewBox: "0 0 " + W + " " + H,
      preserveAspectRatio: "xMidYMid meet", role: "img",
      "aria-label": "Dwell and flight time for every keystroke, in milliseconds"
    });

    [0, 0.25, 0.5, 0.75, 1].forEach(function (fraction) {
      var y = H - pad.b - fraction * (H - pad.t - pad.b);
      chart.appendChild(svg("line", {
        x1: pad.l, y1: y, x2: W - pad.r, y2: y,
        stroke: "var(--rule)", "stroke-width": "1"
      }));
      var label = svg("text", {
        x: pad.l - 8, y: y + 4, "text-anchor": "end", fill: "var(--mute)",
        "font-size": "11", "font-family": "ui-monospace, monospace"
      });
      label.textContent = String(Math.round(fraction * top));
      chart.appendChild(label);
    });

    var count = series.length;
    chart.appendChild(polyline(series, function (e) { return e.flight; },
      W, H, pad, count, top, "var(--warn)"));
    chart.appendChild(polyline(series, function (e) { return e.dwell; },
      W, H, pad, count, top, "var(--human)"));

    var axis = svg("text", {
      x: pad.l, y: H - 8, fill: "var(--mute)", "font-size": "11",
      "font-family": "ui-monospace, monospace"
    });
    axis.textContent = "keystroke 1 → " + count + "   (milliseconds up the side)";
    chart.appendChild(axis);

    var wrap = el("div", "trace-wrap");
    wrap.appendChild(chart);
    host.appendChild(wrap);

    var legend = el("div", "legend");
    [["flight, gap between key presses", "var(--warn)"],
     ["dwell, how long each key was held", "var(--human)"]].forEach(function (item) {
      var entry = el("span");
      var swatch = el("i");
      swatch.style.borderTopColor = item[1];
      entry.appendChild(swatch);
      entry.appendChild(el("span", null, item[0]));
      legend.appendChild(entry);
    });
    host.appendChild(legend);
    return host;
  }

  /* ------------------------------------------------ Fitts's law and traps */

  function fitts(data) {
    var samples = (data || {}).samples || [];
    if (samples.length < 2) { return null; }

    var host = el("div");
    var slope = data.slope_ms_per_bit;
    var fit = data.r_squared;
    var throughput = data.throughput_bits_per_s;

    var tiles = el("div", "tiles");
    tiles.appendChild(tile("targets", String(data.measured || samples.length)));
    if (slope !== null && slope !== undefined) {
      tiles.appendChild(tile("ms per bit", Math.round(slope),
        slope < 40 ? "bad" : "good"));
    }
    if (fit !== null && fit !== undefined) {
      tiles.appendChild(tile("fit r²", fit.toFixed(2)));
    }
    if (throughput !== null && throughput !== undefined) {
      tiles.appendChild(tile("bits / second", throughput.toFixed(1),
        throughput > 14 ? "bad" : "good"));
    }
    tiles.appendChild(tile("misses", String(data.misses || 0)));
    host.appendChild(tiles);

    var W = 1000, H = 340;
    var pad = { l: 56, r: 14, t: 14, b: 34 };
    var idLow = Infinity, idHigh = -Infinity, mtTop = 0;
    samples.forEach(function (s) {
      idLow = Math.min(idLow, s.id_bits);
      idHigh = Math.max(idHigh, s.id_bits);
      mtTop = Math.max(mtTop, s.mt_ms);
    });
    if (idHigh - idLow < 0.5) { idHigh = idLow + 0.5; }
    mtTop = Math.max(60, Math.ceil(mtTop / 100) * 100);

    function px(bits) {
      return pad.l + ((bits - idLow) / (idHigh - idLow)) * (W - pad.l - pad.r);
    }
    function py(ms) {
      return H - pad.b - (Math.min(ms, mtTop) / mtTop) * (H - pad.t - pad.b);
    }

    var chart = svg("svg", {
      "class": "trace", viewBox: "0 0 " + W + " " + H,
      preserveAspectRatio: "xMidYMid meet", role: "img",
      "aria-label": "Movement time against index of difficulty for each target"
    });

    [0, 0.25, 0.5, 0.75, 1].forEach(function (fraction) {
      var y = H - pad.b - fraction * (H - pad.t - pad.b);
      chart.appendChild(svg("line", {
        x1: pad.l, y1: y, x2: W - pad.r, y2: y,
        stroke: "var(--rule)", "stroke-width": "1"
      }));
      var label = svg("text", {
        x: pad.l - 8, y: y + 4, "text-anchor": "end", fill: "var(--mute)",
        "font-size": "11", "font-family": "ui-monospace, monospace"
      });
      label.textContent = Math.round(fraction * mtTop) + "";
      chart.appendChild(label);
    });

    // The fitted line. Its steepness is the whole measurement: flat means the
    // target's size and distance never cost the client anything.
    if (slope !== null && slope !== undefined &&
        data.intercept_ms !== null && data.intercept_ms !== undefined) {
      chart.appendChild(svg("line", {
        x1: px(idLow), y1: py(data.intercept_ms + slope * idLow),
        x2: px(idHigh), y2: py(data.intercept_ms + slope * idHigh),
        stroke: slope < 40 ? "var(--bot)" : "var(--human)",
        "stroke-width": "2", "stroke-dasharray": "7 5"
      }));
    }

    samples.forEach(function (s) {
      chart.appendChild(svg("circle", {
        cx: px(s.id_bits), cy: py(s.mt_ms), r: "5",
        fill: "var(--ink)", opacity: "0.78"
      }));
      var mark = svg("text", {
        x: px(s.id_bits) + 9, y: py(s.mt_ms) - 7, fill: "var(--mute)",
        "font-size": "10", "font-family": "ui-monospace, monospace"
      });
      mark.textContent = Math.round(s.width_px) + "px";
      chart.appendChild(mark);
    });

    var axis = svg("text", {
      x: pad.l, y: H - 10, fill: "var(--mute)", "font-size": "11",
      "font-family": "ui-monospace, monospace"
    });
    axis.textContent = "index of difficulty  log2(2D/W)  " + idLow.toFixed(1)
      + " → " + idHigh.toFixed(1) + " bits    (movement time in ms up the side)";
    chart.appendChild(axis);

    var wrap = el("div", "trace-wrap");
    wrap.appendChild(chart);
    host.appendChild(wrap);

    var legend = el("div", "legend");
    [["one target, labelled with its width", "var(--ink)", "dot"],
     ["the fitted line", slope < 40 ? "var(--bot)" : "var(--human)", "line"]]
      .forEach(function (item) {
        var entry = el("span");
        var swatch = el("i", item[2] === "dot" ? "dot" : null);
        if (item[2] === "dot") { swatch.style.background = item[1]; }
        else { swatch.style.borderTopColor = item[1]; }
        entry.appendChild(swatch);
        entry.appendChild(el("span", null, item[0]));
        legend.appendChild(entry);
      });
    host.appendChild(legend);
    return host;
  }

  function honeypots(data) {
    if (!data || !data.count) { return null; }
    var rows = Object.keys(data.types || {}).map(function (kind) {
      return [kind, data.types[kind] + " time(s)"];
    });
    rows.push(["controls touched", (data.ids || []).join(", ") || "—"]);
    rows.push(["dispatched by script", String(data.untrusted || 0)]);
    return table(rows);
  }

  function ladder(layers, caught) {
    var host = el("div", "ladder");
    var peak = 4;
    LAYERS.forEach(function (n) {
      peak = Math.max(peak, Math.abs((layers[n] || {}).weight || 0));
    });
    LAYERS.forEach(function (n) {
      var entry = layers[n];
      var h = toward((entry || {}).weight);
      var pct = Math.min(50, Math.abs(h) / peak * 50);
      var row = el("div", "row");
      var label = el("div", "n" + (n === caught ? " hit" : ""), n);
      var axis = el("div", "axis");
      axis.innerHTML = '<div class="z"></div><div class="b" style="background:' +
        (h >= 0 ? "var(--human)" : "var(--bot)") + ";left:" + (h >= 0 ? 50 : 50 - pct) +
        "%;width:" + pct + '%"></div>';
      var value = el("div", "v", signed(h));
      row.appendChild(label); row.appendChild(axis); row.appendChild(value);
      host.appendChild(row);
    });
    return host;
  }

  function signals(list) {
    var host = el("div");
    LAYERS.forEach(function (layer) {
      var rows = (list || []).filter(function (s) { return s.layer === layer; });
      if (!rows.length) { return; }
      var weight = rows.reduce(function (sum, s) { return sum + s.weight; }, 0);
      var group = el("div", "group");
      group.appendChild(el("h3", null, layer + " · " + signed(toward(weight))));
      var ul = el("ul", "sig");
      // Most automated-looking first, which is the most negative once negated.
      rows.sort(function (a, b) { return b.weight - a.weight; }).forEach(function (s) {
        var li = el("li", s.weight > 0 ? "bot" : "human");
        li.appendChild(el("code", null, s.id + "  " + signed(toward(s.weight))));
        li.appendChild(el("span", null, s.detail));
        ul.appendChild(li);
      });
      group.appendChild(ul);
      host.appendChild(group);
    });
    return host.children.length ? host : el("div", "empty", "The scorer produced no signals.");
  }

  function render(data) {
    record = data;
    var result = data.result || {};
    document.getElementById("m-id").textContent = text(data.id);
    document.getElementById("m-label").textContent = text(data.label);
    document.getElementById("m-time").textContent =
      text((data.time || "").replace("T", " "));

    var host = document.getElementById("body");
    host.innerHTML = "";

    var verdict = el("section");
    verdict.appendChild(el("h2", null, "Verdict"));
    var readout = el("div", "readout");
    var num = el("div", "num", result.score);
    num.style.color = colorFor(result.score);
    readout.appendChild(num);
    readout.appendChild(el("div", "verdict", result.verdict));
    verdict.appendChild(readout);
    var rail = el("div", "rail");
    rail.innerHTML = '<div class="track"></div><div class="needle" style="left:' +
      ((result.score - 1) / 98 * 100) + '%"></div>';
    verdict.appendChild(rail);
    var ends = el("div", "ends");
    ends.innerHTML = "<span>1 automated</span><span>50 unclear</span><span>99 human</span>";
    verdict.appendChild(ends);
    verdict.appendChild(el("p", "hint",
      result.first_catching_layer
        ? "The " + result.first_catching_layer + " layer flagged this run first. The strongest " +
          "single layer was " + result.strongest_layer + "."
        : "No layer flagged this run."));
    host.appendChild(verdict);

    host.appendChild(section("Evidence by layer",
      ladder(result.layers || {}, result.first_catching_layer),
      "Each bar reads the same way as the rail above it: to the right and blue is "
      + "evidence of a person, to the left and red is evidence of automation, and the "
      + "length is how much that layer contributed. A layer with no bar found nothing "
      + "either way. export.csv stores these numbers negated, so w_browser is the "
      + "value shown here with its sign turned around."));
    host.appendChild(section("Signals", signals(result.signals),
      "One line per piece of evidence, most automated-looking first. Report the "
      + "detection IDs, not only the score: an ID names what was measured, and a "
      + "score is one number a reader cannot check."));

    var drawn = trace(data.behavior, data.js);
    if (drawn) {
      host.appendChild(section("How the pointer moved", drawn,
        "The path the pointer actually travelled, in the client's own viewport "
        + "coordinates. Read the dots before the line: each one is a single recorded "
        + "event, so a dense trail means a device reporting continuously, and a line "
        + "with almost no dots on it means the pointer was placed rather than moved. "
        + "A hand bows away from the straight line between two points and corrects "
        + "itself as it arrives; an interpolation runs dead straight and lands exactly. "
        + "Red dashes are jumps of over " + TELEPORT_PX + " px with no event in between."));
    }

    var metrics = result.behavior_metrics;
    if (metrics) {
      var trapped = honeypots(metrics.honeypots);
      if (trapped) {
        host.appendChild(section("Honeypots touched", trapped,
          "These controls are invisible, carry tabindex -1 and are hidden from "
          + "assistive technology, so neither a person nor a screen reader can arrive "
          + "at one. Anything that touched one found it by reading the DOM."));
      }

      var law = fitts(metrics.fitts);
      if (law) {
        host.appendChild(section("Fitts's law: speed against accuracy", law,
          "Each dot is one target: how difficult it was to acquire, against how long "
          + "the client took. Difficulty is log2(2D/W), where D is the distance the "
          + "pointer had to cover and W the width of the target, so a small distant "
          + "circle sits to the right and a large near one to the left. A hand trades "
          + "speed for accuracy along a straight line at roughly 100 to 200 ms per "
          + "extra bit. A tool that jumps to a coordinate draws a flat line, because "
          + "the size of the target never cost it anything, and it collects difficulty "
          + "faster than a hand physically can."));
      }

      var typing = keystrokes(metrics.keys);
      if (typing) {
        host.appendChild(section("How the keyboard was typed on", typing,
          "Dwell is how long each key was held down; flight is the gap from the "
          + "previous key press to this one. A hand produces two ragged lines: hold "
          + "times differ by finger and by key, and the gaps stretch at word "
          + "boundaries and after punctuation, then close up inside a familiar word. "
          + "A driver that sleeps a fixed interval between keys draws two nearly "
          + "flat lines. The variation figures are the spread divided by the mean, "
          + "which is the comparison that holds whether the typist is fast or slow."));
      }
    }
    if (metrics) {
      var grid = el("div", "two");
      var left = el("div");
      left.appendChild(el("h3", null, "pointer"));
      left.appendChild(table(flatten(metrics.pointer)));
      var right = el("div");
      right.appendChild(el("h3", null, "keys"));
      // series is the per-keystroke chart above; samples is the Fitts scatter.
      right.appendChild(table(flatten(without(metrics.keys, ["series"]))));
      right.appendChild(el("h3", null, "clicks and input"));
      right.appendChild(table(flatten(metrics.clicks).concat(flatten(metrics.inputs))));
      grid.appendChild(left); grid.appendChild(right);
      host.appendChild(section("Behavioural metrics", grid,
        "Every number here is derived on the server from the stored event stream. " +
        "Straightness is direct distance over travelled distance: 1.0 is a straight line. " +
        "Dwell is how long a key was held; flight is the gap between key presses."));
    }

    var tasks = (data.behavior || {}).targets || [];
    if (tasks.length) {
      host.appendChild(section("Targets clicked", table(tasks.map(function (t) {
        return [t.id, "centre " + t.cx + "," + t.cy + " at " + t.t + " ms"];
      }))));
    }

    if (data.tls) {
      host.appendChild(section("TLS handshake", table([
        ["ja4", data.tls.ja4], ["ja4_r", data.tls.ja4_r], ["ja3", data.tls.ja3],
        ["alpn", (data.tls.alpn || []).join(", ")], ["grease", String(data.tls.grease)],
        ["cipher count", data.tls.cipher_count], ["extension count", data.tls.ext_count]
      ])));
    }

    host.appendChild(section("Browser fingerprint", table(flatten(data.js))));
    if (data.runtime) {
      host.appendChild(section("Runtime probes", table(flatten(data.runtime))));
    }
    if (data.environment) {
      host.appendChild(section("Environment probes", table(flatten(data.environment))));
    }
    host.appendChild(section("Request headers, in the order the browser sent them",
      table((data.header_order || []).map(function (name, i) {
        return [(i + 1) + ". " + name, (data.headers || {})[name]];
      })),
      "Scored from the " + text(data.header_source) + " request."));

    var exports = el("div", "btns");
    var jsonButton = el("button", null, "Download JSON");
    jsonButton.addEventListener("click", function () {
      save(JSON.stringify(record, null, 2),
           "botlab-" + (record.label || record.id) + ".json");
    });
    var profileButton = el("button", "ghost", "Download profile");
    var printButton = el("button", "ghost", "Print");
    printButton.addEventListener("click", function () { window.print(); });
    exports.appendChild(jsonButton);
    exports.appendChild(profileButton);
    exports.appendChild(printButton);
    var exportSection = section("Export", exports,
      "The JSON holds the whole record, including the raw event stream this report was " +
      "derived from. The profile is the same run pointed the other way: the fields another " +
      "client would have to report to look like this one, in the shape a launcher takes.");
    exportSection.className = "noprint";
    host.appendChild(exportSection);

    profileButton.addEventListener("click", function () {
      profileButton.disabled = true;
      fetch("/api/sessions/" + encodeURIComponent(record.id) + "/profile")
        .then(function (r) { return r.json(); })
        .then(function (envelope) {
          var built = (envelope.data || {}).profile;
          if (!built) { throw new Error("no profile"); }
          save(JSON.stringify(built, null, 2),
               "botlab-profile-" + built.name + ".json");
          showGaps(exportSection, (envelope.data || {}).gaps || []);
        })
        .catch(function () {
          showGaps(exportSection, ["The profile could not be built. The harness may be " +
                                   "running an older build than this page."]);
        })
        .then(function () { profileButton.disabled = false; });
    });
  }

  function save(text, filename) {
    var blob = new Blob([text], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var link = document.createElement("a");
    link.href = url;
    link.download = filename;
    link.click();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }

  /* Say which profile fields no measurement backed. The file itself cannot
     show it: every field prints the same way whether it was read off the
     client or filled in from a platform default, and a reader who cannot tell
     them apart will reproduce a guess believing it was measured. */
  function showGaps(host, gaps) {
    var old = host.querySelector(".gaps");
    if (old) { host.removeChild(old); }
    var box = el("div", "gaps");
    box.appendChild(el("p", "hint", gaps.length
      ? "Fields in that profile which no measurement backed:"
      : "Every field in that profile came from this run."));
    if (gaps.length) {
      var list = el("ul", "sig");
      gaps.forEach(function (gap) { list.appendChild(el("li", null, gap)); });
      box.appendChild(list);
    }
    host.appendChild(box);
  }

  var id = location.pathname.replace(/\/+$/, "").split("/").pop();
  fetch("/api/sessions/" + encodeURIComponent(id))
    .then(function (r) {
      if (!r.ok) { throw new Error("not found"); }
      return r.json();
    })
    .then(function (envelope) { render(envelope.data); })
    .catch(function () {
      document.getElementById("body").innerHTML =
        '<div class="empty">No run has the id ' + id + '. It may have been trimmed ' +
        'from the log, or the run never finished.</div>';
    });
})();
</script>
</body>
</html>
